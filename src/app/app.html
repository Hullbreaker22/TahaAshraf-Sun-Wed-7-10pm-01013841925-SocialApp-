<ngx-spinner bdColor="rgba(15, 23, 42, 0.85)" size="medium" type="ball-scale-multiple" [fullScreen]="true">
    <div class="relative flex flex-col items-center gap-4 rounded-3xl bg-white px-10 py-7 shadow-2xl shadow-sky-500/10 border border-slate-100 backdrop-blur-2xl">
        
        <div class="relative flex items-center justify-center w-16 h-16">
            <div class="absolute inset-0 rounded-full border-[3px] border-transparent border-t-[#1877f2] border-b-sky-300 animate-[spin_1.5s_linear_infinite]"></div>
            <div class="absolute inset-2 rounded-full border-[3px] border-transparent border-l-indigo-600 border-r-sky-400 animate-[spin_0.8s_linear_infinite_reverse]"></div>
            <div class="absolute flex items-center justify-center w-8 h-8 rounded-full bg-sky-50 text-[#1877f2] shadow-inner animate-pulse">
                <i class="fa-solid fa-snowflake text-sm"></i>
            </div>
        </div>

        <div class="flex flex-col items-center gap-0.5">
            <span class="text-xs font-black tracking-widest text-slate-800 uppercase animate-pulse">
                Loading
            </span>
            <span class="text-[10px] font-semibold text-slate-400">
                Please wait a moment...
            </span>
        </div>

    </div>
</ngx-spinner>
<router-outlet></router-outlet>

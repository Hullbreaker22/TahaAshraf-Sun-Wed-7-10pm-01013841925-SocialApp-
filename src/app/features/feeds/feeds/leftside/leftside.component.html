<div class="left-side hidden h-fit space-y-3 xl:sticky xl:top-21 xl:block">
  <div 
    [class.w-16]="isCollapsed()" 
    [class.w-52]="!isCollapsed()" 
    class="relative flex flex-col justify-between min-h-105 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-2.5 shadow-lg transition-all duration-300 ease-in-out overflow-hidden"
  >
    <div>
      <div class="flex items-center mb-2 px-1" [class.justify-center]="isCollapsed()" [class.justify-between]="!isCollapsed()">
        @if (!isCollapsed()) {
          <span class="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider px-1">Menu</span>
        }
        <button 
          (click)="toggleCollapse()" 
          [title]="isCollapsed() ? 'Expand Menu' : 'Collapse Menu'"
          class="flex h-8 w-8 items-center justify-center rounded-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-blue-600 dark:hover:text-blue-400 transition shadow-sm cursor-pointer"
        >
          <i class="fa-solid text-xs transition-transform duration-300" [class.fa-chevron-left]="!isCollapsed()" [class.fa-chevron-right]="isCollapsed()"></i>
        </button>
      </div>

      <div class="space-y-1">
        <button 
          #leftBTN 
          (click)="activeFeed()" 
          [title]="isCollapsed() ? ('leftside.Feed' | translate) : ''"
          class="flex w-full items-center cursor-pointer gap-3 rounded-xl px-3 py-2.5 text-left text-[.875rem] font-bold transition-all bg-[#e7f3ff] dark:bg-blue-950/60 text-[#1877f2] dark:text-blue-400"
          [class.justify-center]="isCollapsed()"
        >
          <i class="fa-regular fa-newspaper text-[18px] shrink-0 text-current"></i>
          @if (!isCollapsed()) {
            <span class="truncate">{{ "leftside.Feed" | translate }}</span>
          }
        </button>

        <button 
          #leftBTN 
          (click)="activeMyPosts()" 
          [title]="isCollapsed() ? ('leftside.My Posts' | translate) : ''"
          class="flex w-full items-center cursor-pointer gap-3 rounded-xl px-3 py-2.5 text-left text-[.875rem] font-bold transition-all text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
          [class.justify-center]="isCollapsed()"
        >
          <i class="fa-solid fa-wand-magic-sparkles text-[16px] shrink-0 text-current"></i>
          @if (!isCollapsed()) {
            <span class="truncate">{{ "leftside.My Posts" | translate }}</span>
          }
        </button>

        <button 
          #leftBTN 
          (click)="activeCommunity()" 
          [title]="isCollapsed() ? ('leftside.Community' | translate) : ''"
          class="flex w-full items-center cursor-pointer gap-3 rounded-xl px-3 py-2.5 text-left text-[.875rem] font-bold transition-all text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
          [class.justify-center]="isCollapsed()"
        >
          <i class="fa-solid fa-earth-europe text-[16px] shrink-0 text-current"></i>
          @if (!isCollapsed()) {
            <span class="truncate">{{ "leftside.Community" | translate }}</span>
          }
        </button>

        <button 
          #leftBTN 
          (click)="ActiveMarked()" 
          [title]="isCollapsed() ? ('leftside.Saved' | translate) : ''"
          class="flex w-full items-center cursor-pointer gap-3 rounded-xl px-3 py-2.5 text-left text-[.875rem] font-bold transition-all text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
          [class.justify-center]="isCollapsed()"
        >
          <i class="fa-regular fa-bookmark text-[16px] shrink-0 text-current"></i>
          @if (!isCollapsed()) {
            <span class="truncate">{{ "leftside.Saved" | translate }}</span>
          }
        </button>
      </div>
    </div>

    <div class="pt-3 mt-3 border-t border-slate-100 dark:border-slate-800 space-y-1">
      <a 
        routerLink="/sittings"
        [title]="isCollapsed() ? 'Settings' : ''"
        class="flex w-full items-center cursor-pointer gap-3 rounded-xl px-3 py-2.5 text-left text-[.875rem] font-bold transition-all text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
        [class.justify-center]="isCollapsed()"
      >
        <i class="fa-solid fa-gear text-[16px] shrink-0 text-current"></i>
        @if (!isCollapsed()) {
          <span class="truncate">Settings</span>
        }
      </a>

      <button 
        (click)="logout()" 
        [title]="isCollapsed() ? 'Logout' : ''"
        class="flex w-full items-center cursor-pointer gap-3 rounded-xl px-3 py-2.5 text-left text-[.875rem] font-bold transition-all text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40"
        [class.justify-center]="isCollapsed()"
      >
        <i class="fa-solid fa-right-from-bracket text-[16px] shrink-0 text-current"></i>
        @if (!isCollapsed()) {
          <span class="truncate">Logout</span>
        }
      </button>
    </div>
  </div>
</div>

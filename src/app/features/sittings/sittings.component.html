<section class="mx-auto max-w-7xl px-3 py-3.5">
    <div class="min-w-0">
        <div class="mx-auto max-w-2xl">
            <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm sm:p-6 transition-colors">
                <div class="mb-5 flex items-center gap-3">
                    <div class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] dark:bg-blue-950 text-[#1877f2] dark:text-blue-400">
                        <i class="fa-solid fa-key text-current"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold text-slate-900 dark:text-slate-100 sm:text-2xl">
                            {{ "settings.Change Password" | translate }}
                        </h1>
                        <p class="text-sm text-slate-500 dark:text-slate-400">{{ "settings.Keep your account secure by using a strong password." | translate }}</p>
                    </div>
                </div>
                <form [formGroup]="passForm" (ngSubmit)="subitForm()" class="space-y-4">

                    <label class="block">
                        <p class="mb-1.5 block text-sm font-bold text-slate-700 dark:text-slate-300">
                            {{ "settings.Current Password" | translate }}
                        </p>
                        <input formControlName="password" type="password" [placeholder]="'settings.Enter new password' | translate" class="w-full rounded-xl border bg-slate-50 dark:bg-slate-950 px-3 py-2.5 text-sm text-slate-800 dark:text-slate-100 outline-none transition border-slate-200 dark:border-slate-700 focus:border-[#1877f2] dark:focus:border-blue-500 focus:bg-white dark:focus:bg-slate-900">
                            @if (passForm.get('password')?.touched) {
                            @if (passForm.get('password')?.hasError('required')) {
                                <span class="mt-1 block text-xs font-semibold text-rose-600 dark:text-rose-400">{{ "settings.New password is required." | translate }}</span>
                            } @else if (passForm.get('password')?.hasError('pattern')) {
                                <span class="mt-1 block text-xs font-semibold text-rose-600 dark:text-rose-400">{{ "settings.At least 8 characters with uppercase, lowercase, number, and special character" | translate }}</span>
                            }
                            }
                    </label>

                    <label class="block">
                        <p class="mb-1.5 block text-sm font-bold text-slate-700 dark:text-slate-300">
                            {{ "settings.New password" | translate }}
                        </p>
                        <input formControlName="newPassword" type="password" [placeholder]="'settings.Enter new password' | translate" class="w-full rounded-xl border bg-slate-50 dark:bg-slate-950 px-3 py-2.5 text-sm text-slate-800 dark:text-slate-100 outline-none transition border-slate-200 dark:border-slate-700 focus:border-[#1877f2] dark:focus:border-blue-500 focus:bg-white dark:focus:bg-slate-900">
                            @if (passForm.get('newPassword')?.touched) {
                            @if (passForm.get('newPassword')?.hasError('required')) {
                                <span class="mt-1 block text-xs font-semibold text-rose-600 dark:text-rose-400">{{ "settings.New password is required." | translate }}</span>
                            } @else if (passForm.get('newPassword')?.hasError('pattern')) {
                                <span class="mt-1 block text-xs font-semibold text-rose-600 dark:text-rose-400">{{ "settings.At least 8 characters with uppercase, lowercase, number, and special character" | translate }}</span>
                            }
                            }
                    </label>

                    <label class="block">
                        <span class="mb-1.5 block text-sm font-bold text-slate-700 dark:text-slate-300">{{ "settings.Confirm new password" | translate }}</span>
                        <input formControlName="ConfirmPass" type="password" [placeholder]="'settings.Re-enter new password' | translate" class="w-full rounded-xl border bg-slate-50 dark:bg-slate-950 px-3 py-2.5 text-sm text-slate-800 dark:text-slate-100 outline-none transition border-slate-200 dark:border-slate-700 focus:border-[#1877f2] dark:focus:border-blue-500 focus:bg-white dark:focus:bg-slate-900">
                        @if (passForm.get('ConfirmPass')?.touched) {
                        @if (passForm.get('ConfirmPass')?.hasError('required')) {
                            <span class="mt-1 block text-xs font-semibold text-rose-600 dark:text-rose-400">{{ "settings.Please confirm your new password." | translate }}</span>
                        } @else if (passForm.hasError('mismatch')) {
                            <span class="mt-1 block text-xs font-semibold text-rose-600 dark:text-rose-400">{{ "settings.Passwords don't match." | translate }}</span>
                        }
                        }                 
                    </label>
                    <button type="submit" class="inline-flex cursor-pointer w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60">{{ "settings.Update Password" | translate }}</button>
                </form>
            </div>
        </div>
    </div>
</section>
